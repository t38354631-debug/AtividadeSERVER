<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Clubes</title>
</head>

<body>

    <h1>Cadastro de clubes</h1>

    <form action="http://localhost:3000" method="POST">

        <label for="id">Identificação:</label>
        <input
            type="number"
            id="id"
            name="id"
            placeholder="Identificação"
            min="1"
            required
        >

        <br><br>

        <label for="nome">Nome do clube:</label>
        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Nome do clube"
            required
        >

        <br><br>

        <label for="vitorias">Vitórias:</label>
        <input
            type="number"
            id="vitorias"
            name="vitorias"
            placeholder="Quantidade de vitórias"
            min="0"
            required
        >

        <br><br>

        <label for="empates">Empates:</label>
        <input
            type="number"
            id="empates"
            name="empates"
            placeholder="Quantidade de empates"
            min="0"
            required
        >

        <br><br>

        <label for="derrotas">Derrotas:</label>
        <input
            type="number"
            id="derrotas"
            name="derrotas"
            placeholder="Quantidade de derrotas"
            min="0"
            required
        >

        <br><br>

        <button type="reset">Limpar</button>
        <button type="submit">Enviar</button>

    </form>

</body>

</html>
